<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link rel="manifest" href="manifest.json" />
    <title>Glof</title>
    <link rel="stylesheet" href="fonts/monoid.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="media/favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <div id="game-container">
      <div id="info-panel">
        <span id="strokes">0</span> | <span id="total-strokes">0</span>
      </div>
      <canvas id="gameCanvas"></canvas>
      <div id="transition-overlay"></div>
    </div>
    <div id="orientation-warning">
      <p id="orientation-title">glof</p>
      <p>rotate device</p>
    </div>

    <div id="menu-overlay">
      <div id="menu">
        <div id="menu-title">glof</div>
        <hr/>
        <p id="menu-hole"></p>
        <p id="menu-total"></p>
        <p id="menu-hio"></p>
        <button id="menu-reset">reset progress</button>
      </div>
    </div>

    <script type="module" src="glof.js"></script>
  </body>
</html>
